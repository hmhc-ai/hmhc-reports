name: Deploy site to GitHub Pages

# Builds the static site with .github/site/build_site.py and deploys it to
# https://hmhc-ai.github.io/hmhc-reports/ on every push to main.
# TEST deployment only — no custom domain is configured; the public
# reports.hmhc.ai remains wherever the author points it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: pip install markdown
      - name: Build site
        run: python3 .github/site/build_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
